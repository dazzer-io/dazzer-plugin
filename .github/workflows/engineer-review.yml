# @purpose: Asks the organisation's shared engineer review to read every pull request.
#
# The call is pinned to one commit of the shared workflow, the same commit Gates' leak check and
# workflow lint name (scripts/checks/check-leak-gate.mjs holds it), and its job hands the review only the
# three grants it uses: reading the code, setting a commit status and reading the pull request.
# The workflow's own token grants nothing.

name: Engineer review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # zizmor flags this trigger because it usually runs a pull request's code with this
  # repository's token. The review it calls checks out only its own pinned script, never the
  # pull request's code, and holds no secret.
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  engineer-review:
    uses: dazzer-io/.github/.github/workflows/engineer-review.yml@e3a419d50cd4dc87adfd75ba6ee823232f4aa8f3 # dazzer-io/.github main, 19 Nov 2026
    permissions:
      contents: read
      statuses: write
      pull-requests: read
