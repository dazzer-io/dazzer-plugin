# @purpose: Reads the repository against the OpenSSF Scorecard after every change to main, so a
# step back in how the repository is protected (a token grant, an unpinned action, a dangerous
# trigger) shows up as a code scanning alert. It is a regression detector, not a score to chase.
#
# It runs on main's changes and by hand. A weekly reading is a timed job, and timed jobs that read
# and report run in the organisation's scheduler, not in this repository. Results stay in this
# repository's code scanning; nothing is published elsewhere.

name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    # GitHub's machine: a public repository's jobs never run on our own machines.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write # only to upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
