# @purpose: Runs every check on every proposed change, so a defect in the one script that
# executes on other people's machines cannot reach the branch people install from.
#
# The checks are plain Node scripts and shell suites. The one dependency is the Claude Code
# that runs the plate pane's tests, pinned with its hash in package-lock.json and installed
# with its install scripts off. Everything runs in the one job named Gates, because that is
# the only check the main branch's rules require.

name: Gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gates:
    name: Gates
    # GitHub's machine: a public repository's jobs never run on our own machines.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # The test runner is a whole Claude Code: kept from updating itself or reporting home.
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every ref, so the leak check below reads the whole history it scans refs against.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install the pinned test runner
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Every check and every test in tests/.
      - name: All gates, under the system shell
        run: node scripts/baseline.mjs

      # The script ships as plain POSIX shell and runs under whatever the person's system
      # shell happens to be. On a Mac that is bash in posix mode; here it is dash. They
      # disagree on the numeric comparison one of the defects lives on, so proving it under
      # one says nothing about the other. Only the shell suites run again: nothing else
      # depends on the shell.
      - name: The shell suites again, under bash
        if: ${{ !cancelled() }}
        env:
          SHELL_UNDER_TEST: bash
        run: node scripts/baseline.mjs --shell-suites

      # Asserted, not assumed: the previous suite named its shell internally, so two runs
      # would have reported two passes from one interpreter.
      - name: The two runs really did use different shells
        if: ${{ !cancelled() }}
        run: |
          set -eu
          system=$(sh -c 'echo "${BASH_VERSION:-not-bash}"')
          explicit=$(bash -c 'echo "${BASH_VERSION:-not-bash}"')
          echo "system shell reports: $system"
          echo "bash reports:         $explicit"
          if [ "$system" = "$explicit" ]; then
            echo "Both runs used the same interpreter, so the two-shell check proved nothing." >&2
            exit 1
          fi

      - name: Shell lint
        if: ${{ !cancelled() }}
        run: shellcheck -s sh plugins/dazzer/scripts/*.sh tests/*.sh

      # Audits the workflows and dependabot.yml for the known ways a workflow is turned against
      # its repository: dangerous triggers, token grants, credentials left behind, injected
      # expressions. .github/zizmor.yml makes it refuse any action not pinned to a full commit.
      # zizmor itself is held at 1.32.0, the version this audit was proven with: the action
      # installs that version from a wheel whose hash its pinned commit holds, and a newer
      # zizmor changes nothing here until the version line below does.
      - name: Workflow audit
        if: ${{ !cancelled() }}
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true

      # Lints every workflow with actionlint, the organisation's own: scripts/actionlint.mjs of the
      # shared dazzer-io/.github, checked out at the same full commit as the leak check below. It
      # runs one pinned actionlint release, refused unless its SHA-256 matches. The checkout lands
      # in a folder of its own, removed once the lint has read the workflows.
      - name: Check out the shared workflow lint
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dazzer-io/.github
          ref: e3a419d50cd4dc87adfd75ba6ee823232f4aa8f3
          path: .shared-lint
          persist-credentials: false

      - name: Workflow lint
        if: ${{ !cancelled() }}
        run: |
          status=0
          node .shared-lint/scripts/actionlint.mjs .github/workflows/*.yml || status=$?
          rm -rf .shared-lint
          exit "$status"

      # Reads every tracked file and the tip of every branch, tag and pull request ref for private
      # names, held only as one-way hashes, and refuses a change that adds one. Last, because it
      # sets up its own Node. It needs only the contents: read this job already grants.
      - name: Leak check
        if: ${{ !cancelled() }}
        uses: dazzer-io/.github/leak-check@e3a419d50cd4dc87adfd75ba6ee823232f4aa8f3 # dazzer-io/.github main, 19 Nov 2026
