# @purpose: Marks every released version with a retrievable tag, so there is always a
# known-good point to go back to. Before this, "roll back" meant hunting for a commit id,
# and there was nothing named to return to at all.
#
# It marks what shipped; it does not publish anything. People install from the default
# branch, so a bad release is undone by putting the branch back to the previous tag.

name: Release tag

on:
  push:
    branches: [main]

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions: {}

jobs:
  tag:
    name: Tag the released version
    # GitHub's machine: a public repository's jobs never run on our own machines.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # only to push the tag
    steps:
      # The checkout keeps its credential because the last step pushes the tag with it. Nothing
      # in this job runs code from the repository, so nothing else can reach that credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      # Every version is written from source/manifest.json, and the gates refuse a generated
      # file that differs from it, so this one file is the version that shipped.
      # Exactly three whole numbers: the generator refuses any other shape, and so does this.
      - name: Read the shipped version
        id: version
        shell: bash
        run: |
          set -eu
          v=$(jq -r .version source/manifest.json)
          if [[ ! "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "source/manifest.json holds no version of the shape 1.2.3: $v" >&2
            exit 1
          fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "shipped version is $v"

      - name: Tag it, if it is not already tagged
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already exists - nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
          echo "tagged v$VERSION"
